<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Осциллограф — Oscilloscope</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/oscilloscope.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="lg" href="index.html">⬢ Smart Traffic System</a>
    <a class="lnk" href="index.html" data-ru="Главная" data-en="Home"></a>
    <a class="lnk" href="traffic_control_station.html" data-ru="Станция" data-en="Station"></a>
    <a class="lnk" href="analytics.html" data-ru="Аналитика" data-en="Analytics"></a>
    <a class="lnk active" href="oscilloscope.html" data-ru="Осциллограф" data-en="Oscilloscope"></a>
    <span class="sp"></span>
    <button id="btnLang">EN</button>
  </nav>

  <section class="card">
    <h3 data-ru="Осциллограф сигналов контроллера" data-en="Controller signal oscilloscope"></h3>
    <div class="row">
      <button id="btnRun" class="primary" data-ru="⏸ Пауза" data-en="⏸ Pause"></button>
      <span class="seg" id="chipSel">
        <button data-chip="K561TL1" class="sel">К561ТЛ1</button>
        <button data-chip="NE555">NE555</button>
      </span>
      <label class="fld"><span data-ru="Развёртка" data-en="Time base"></span>
        <select id="tb">
          <option value="2">2 s</option>
          <option value="4" selected>4 s</option>
          <option value="8">8 s</option>
        </select>
      </label>
      <label class="fld"><span data-ru="Скорость фаз" data-en="Phase speed"></span>
        <select id="spd"><option value="1">1×</option><option value="3" selected>3×</option><option value="6">6×</option></select>
      </label>
    </div>
    <div class="legend" style="margin-top:10px">
      <span><i style="background:var(--red)"></i>R (GPIO17)</span>
      <span><i style="background:var(--amber)"></i>Y (GPIO27)</span>
      <span><i style="background:var(--green)"></i>G (GPIO22)</span>
      <span><i style="background:var(--clk)"></i><span data-ru="CLK · тактовый генератор" data-en="CLK · timer clock"></span></span>
    </div>
  </section>

  <div class="grid">
    <section class="card">
      <h3 data-ru="Экран" data-en="Screen"></h3>
      <div class="scopewrap"><canvas id="scope" width="820" height="420"></canvas></div>
      <p class="hint" data-ru="Нижняя дорожка CLK — выход таймера. Обратите внимание на «дрожание» (джиттер) фронтов: у NE555 оно заметно больше, чем у К561ТЛ1." data-en="The bottom CLK track is the timer output. Note the edge jitter: NE555 wobbles noticeably more than К561ТЛ1."></p>
    </section>

    <aside>
      <section class="card">
        <h3 data-ru="Измерения" data-en="Measurements"></h3>
        <div class="meas">
          <div class="kv full"><div class="k" data-ru="Активное ядро" data-en="Active core"></div><div class="v" id="m-chip">—</div></div>
          <div class="kv"><div class="k" data-ru="Тактовая частота" data-en="Clock freq"></div><div class="v" id="m-freq">—</div></div>
          <div class="kv"><div class="k" data-ru="Период" data-en="Period"></div><div class="v" id="m-per">—</div></div>
          <div class="kv full"><div class="k" data-ru="Джиттер фронта" data-en="Edge jitter"></div><div class="v" id="m-jit">—</div></div>
          <div class="kv"><div class="k" data-ru="Скважность" data-en="Duty"></div><div class="v" id="m-duty">50%</div></div>
          <div class="kv"><div class="k" data-ru="Фаза" data-en="Phase"></div><div class="v" id="m-phase">—</div></div>
        </div>
      </section>
      <section class="card">
        <h3 data-ru="Джиттер фронта (увеличение)" data-en="Edge jitter (zoom)"></h3>
        <div class="scopewrap"><canvas id="eye" width="280" height="160"></canvas></div>
        <p class="hint" data-ru="Наложение множества фронтов. Ширина «размытия» = джиттер." data-en="Many edges overlaid. The blur width = jitter."></p>
      </section>
    </aside>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/oscilloscope.js"></script>
</body>
</html>
