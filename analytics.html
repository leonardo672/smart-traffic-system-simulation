<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитика надёжности — Reliability Analytics</title>
<style>
  :root{--bg:#0b0f14;--panel:#121922;--panel2:#0e141c;--line:#1f2a36;--ink:#e7eef6;
    --muted:#8aa0b4;--accent:#36d3b0;--accent2:#2aa0ff;--ne:#e0a23a;--k5:#36d3b0;
    --ok:#37d67a;--danger:#ff5a5a;--amber:#ffb300;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--mono:ui-monospace,Consolas,monospace;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#13202b,#0b0f14);
       color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 20px 48px}
  .nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;
       background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .nav .lg{font-weight:600;margin-right:10px;color:var(--accent);text-decoration:none}
  .nav a.lnk{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px}
  .nav a.lnk:hover{color:var(--ink);background:var(--panel2)}
  .nav a.lnk.active{color:#04223f;background:var(--accent);font-weight:600}
  .nav .sp{margin-left:auto}
  #btnLang{font-family:var(--mono);font-size:13px;padding:6px 12px;border-radius:8px;
       background:var(--panel2);border:1px solid var(--accent);color:var(--accent);cursor:pointer}
  #btnLang:hover{background:var(--accent);color:#04201a}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer;background:var(--panel2);
       border:1px solid var(--line);border-radius:8px;padding:9px 14px;transition:.12s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);color:#04201a;border-color:var(--accent);font-weight:600}
  label.fld{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono)}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .kpi .v{font-family:var(--mono);font-size:20px;margin-top:4px}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .v.ne{color:var(--ne)}.v.k5{color:var(--k5)}.v.ok{color:var(--ok)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.charts{grid-template-columns:1fr}}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .chart h4{margin:0 0 4px;font-size:14px;font-weight:600}
  .chart .cap{margin:0 0 8px;font-size:12px;color:var(--muted)}
  canvas{display:block;width:100%;height:auto}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;margin-right:5px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  td.mono{font-family:var(--mono)}.win{color:var(--ok);font-weight:600}
  .rec{font-size:14px;background:#0c2a22;border:1px solid #14503f;border-radius:8px;padding:10px 12px}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="lg" href="index.html">⬢ Smart Traffic System</a>
    <a class="lnk" href="index.html" data-ru="Главная" data-en="Home"></a>
    <a class="lnk" href="traffic_control_station.html" data-ru="Станция" data-en="Station"></a>
    <a class="lnk active" href="analytics.html" data-ru="Аналитика" data-en="Analytics"></a>
    <a class="lnk" href="oscilloscope.html" data-ru="Осциллограф" data-en="Oscilloscope"></a>
    <span class="sp"></span>
    <button id="btnLang">EN</button>
  </nav>

  <section class="card">
    <h3 data-ru="Симуляция стресс-теста надёжности" data-en="Reliability stress-test simulation"></h3>
    <div class="row">
      <label class="fld"><span data-ru="Длительность" data-en="Duration"></span>
        <select id="dur">
          <option value="24">24 h</option>
          <option value="168" selected>168 h (1 нед / 1 wk)</option>
          <option value="720">720 h (1 мес / 1 mo)</option>
          <option value="8760">8760 h (1 год / 1 yr)</option>
        </select>
      </label>
      <label class="fld"><span data-ru="Среда" data-en="Environment"></span>
        <select id="cond">
          <option value="mild" data-ru="спокойная" data-en="mild"></option>
          <option value="harsh" selected data-ru="агрессивная (ветер/осадки)" data-en="harsh (wind/precip)"></option>
          <option value="extreme" data-ru="экстремальная" data-en="extreme"></option>
        </select>
      </label>
      <button id="btnRun" class="primary" data-ru="▶ Запустить тест" data-en="▶ Run test"></button>
      <span class="hint" id="runInfo"></span>
    </div>
  </section>

  <div class="cards">
    <div class="kpi"><div class="k" data-ru="MTBF · NE555" data-en="MTBF · NE555"></div><div class="v ne" id="k-mtbf-ne">—</div><div class="s" data-ru="наработка на отказ" data-en="mean time between failures"></div></div>
    <div class="kpi"><div class="k" data-ru="MTBF · К561ТЛ1" data-en="MTBF · К561ТЛ1"></div><div class="v k5" id="k-mtbf-k">—</div><div class="s" data-ru="наработка на отказ" data-en="mean time between failures"></div></div>
    <div class="kpi"><div class="k" data-ru="Энергия · NE555" data-en="Energy · NE555"></div><div class="v ne" id="k-pow-ne">—</div><div class="s" data-ru="за период теста" data-en="over test period"></div></div>
    <div class="kpi"><div class="k" data-ru="Энергия · К561ТЛ1" data-en="Energy · К561ТЛ1"></div><div class="v k5" id="k-pow-k">—</div><div class="s" data-ru="за период теста" data-en="over test period"></div></div>
  </div>

  <div class="charts">
    <div class="chart">
      <h4 data-ru="Ток потребления (лог. шкала)" data-en="Supply current (log scale)"></h4>
      <p class="cap" data-ru="мкА · ниже — лучше" data-en="µA · lower is better"></p>
      <canvas id="c-cur" width="520" height="220"></canvas>
    </div>
    <div class="chart">
      <h4 data-ru="Точность переключения" data-en="Switching accuracy"></h4>
      <p class="cap" data-ru="мкс · ниже — лучше" data-en="µs · lower is better"></p>
      <canvas id="c-acc" width="520" height="220"></canvas>
    </div>
    <div class="chart">
      <h4 data-ru="Накопленные ложные срабатывания" data-en="Cumulative false triggers"></h4>
      <p class="cap" data-ru="по времени теста" data-en="over test time"></p>
      <canvas id="c-ft" width="520" height="220"></canvas>
      <div class="legend">
        <span><i style="background:var(--ne)"></i>NE555</span>
        <span><i style="background:var(--k5)"></i>К561ТЛ1</span>
      </div>
    </div>
    <div class="chart">
      <h4 data-ru="Отказы и переключения на резерв" data-en="Failures &amp; failovers"></h4>
      <p class="cap" data-ru="событий за период" data-en="events over period"></p>
      <canvas id="c-fail" width="520" height="220"></canvas>
      <div class="legend">
        <span><i style="background:var(--ne)"></i>NE555</span>
        <span><i style="background:var(--k5)"></i>К561ТЛ1</span>
      </div>
    </div>
  </div>

  <section class="card">
    <h3 data-ru="Итоговая таблица" data-en="Summary table"></h3>
    <table>
      <thead><tr><th data-ru="Метрика" data-en="Metric"></th><th>NE555</th><th>К561ТЛ1</th><th data-ru="Лучше" data-en="Winner"></th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
    <div class="rec" id="rec" style="margin-top:12px"></div>
    <p class="hint" data-ru="Данные сгенерированы моделью на основе параметров чипов из config.yaml (помехозащищённость, ток, точность). Это симуляция, не измерения на реальном железе." data-en="Data is generated by a model from the chip parameters in config.yaml (noise immunity, current, accuracy). This is a simulation, not real-hardware measurements."></p>
  </section>
</div>

<script>
(function(){
  "use strict";
  var lang="ru";try{var s=localStorage.getItem("stationLang");if(s==="ru"||s==="en")lang=s;}catch(e){}
  var tr=function(ru,en){return lang==="ru"?ru:en;};
  function applyLang(){document.querySelectorAll("[data-ru]").forEach(function(el){
    el.innerHTML=lang==="ru"?el.getAttribute("data-ru"):el.getAttribute("data-en");});
    document.documentElement.lang=lang;document.getElementById("btnLang").textContent=lang==="ru"?"EN":"RU";}

  // chip parameters (from config.yaml)
  var CHIP={
    NE555:{cur_uA:10000, acc_us:50, ftRate:0.02, wdFp:0.05, color:"#e0a23a"},
    K561TL1:{cur_uA:0.4, acc_us:5, ftRate:0.0, wdFp:0.0, color:"#36d3b0"}
  };
  var COND={mild:{m:0.5,events:24},harsh:{m:1,events:60},extreme:{m:2.2,events:120}};
  var R=null; // last results

  function rnd(){return Math.random();}
  function simulate(hours,cond){
    var c=COND[cond], steps=Math.min(120,Math.max(24,Math.round(hours/ (hours>1000?80:hours>400?8:hours>100?2:0.4))));
    var out={hours:hours,steps:steps,t:[],ft:{NE555:[],K561TL1:[]},chips:{}};
    // motion/noise events per hour scaled by condition
    var evPerH=c.events/24;
    ["NE555","K561TL1"].forEach(function(name){
      var p=CHIP[name];
      var ftCum=0, failures=0, falsePos=0;
      var ftSeries=[];
      for(var i=0;i<steps;i++){
        var hStart=i/steps*hours, hEnd=(i+1)/steps*hours, dh=hEnd-hStart;
        var events=evPerH*dh;
        // false triggers from noise, amplified by harshness for poor-immunity chip
        var ftHere=events*p.ftRate*c.m;
        // add randomness
        ftHere=ftHere*(0.7+0.6*rnd());
        ftCum+=ftHere;
        ftSeries.push(ftCum);
        // watchdog false-positive failures over interval
        var checks=dh*3600/0.5;
        var fp=checks*(p.wdFp/100)*c.m*0.02;
        if(rnd()<fp) falsePos+=Math.max(1,Math.round(fp));
        out.t.push(hEnd);
      }
      // genuine hangs ~ small constant, same for both; failovers = hangs + falsePos
      var hangs=Math.max(0,Math.round(hours/2000 + rnd()*1.5));
      failures=hangs;
      var failovers=hangs+falsePos;
      var mtbf = failovers>0 ? hours/failovers : hours; // h
      var energyWh = p.cur_uA*1e-6 * 5.0 * hours; // I(A)*V*h
      out.chips[name]={ft:Math.round(ftCum),failures:failures,falsePos:falsePos,failovers:failovers,
        mtbf:mtbf,energyWh:energyWh,acc:p.acc_us,cur:p.cur_uA};
      out.ft[name]=ftSeries;
    });
    // de-dup time axis (we pushed twice); rebuild
    out.t=[];for(var j=0;j<steps;j++)out.t.push((j+1)/steps*hours);
    return out;
  }

  // ---- canvas helpers ----
  function setup(cv){var dpr=window.devicePixelRatio||1;var w=cv.clientWidth||520,h=220;
    cv.width=w*dpr;cv.height=h*dpr;var x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
    return {x:x,w:w,h:h};}
  function clearC(x,w,h){x.clearRect(0,0,w,h);}
  function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1)+"M";if(n>=1e3)return (n/1e3).toFixed(1)+"k";
    if(n>=10)return Math.round(n);if(n>=1)return n.toFixed(1);if(n>0)return n.toFixed(2);return "0";}

  function barLog(cv,vals){ // vals:[{label,val,color}]
    var s=setup(cv),x=s.x,w=s.w,h=s.h,pad=36,bw=70,gap=80;
    clearC(x,w,h);
    var max=Math.max.apply(null,vals.map(function(v){return v.val;})),min=Math.min.apply(null,vals.map(function(v){return v.val;}));
    var lmax=Math.log10(Math.max(max,1)), lmin=Math.log10(Math.max(min,0.1))-0.3;
    x.strokeStyle="#243140";x.lineWidth=1;
    for(var g=0;g<=4;g++){var yy=20+(h-50)*g/4;x.beginPath();x.moveTo(40,yy);x.lineTo(w-12,yy);x.stroke();}
    var bx=70;
    vals.forEach(function(v){
      var lv=Math.log10(Math.max(v.val,0.1));
      var frac=(lv-lmin)/(lmax-lmin); if(frac<0.02)frac=0.02; if(frac>1)frac=1;
      var bh=(h-50)*frac, by=20+(h-50)-bh;
      x.fillStyle=v.color;x.fillRect(bx,by,bw,bh);
      x.fillStyle="#e7eef6";x.font="600 13px ui-monospace,Consolas,monospace";x.textAlign="center";
      x.fillText(fmt(v.val),bx+bw/2,by-7);
      x.fillStyle="#9fb4c6";x.font="12px 'Segoe UI',system-ui,Arial,sans-serif";
      x.fillText(v.label,bx+bw/2,h-14);
      bx+=bw+gap;
    });
  }
  function barLin(cv,vals){
    var s=setup(cv),x=s.x,w=s.w,h=s.h,bw=70,gap=80;
    clearC(x,w,h);
    var max=Math.max.apply(null,vals.map(function(v){return v.val;}))||1;max*=1.2;
    x.strokeStyle="#243140";x.lineWidth=1;
    for(var g=0;g<=4;g++){var yy=20+(h-50)*g/4;x.beginPath();x.moveTo(40,yy);x.lineTo(w-12,yy);x.stroke();}
    var bx=70;
    vals.forEach(function(v){
      var bh=(h-50)*(v.val/max), by=20+(h-50)-bh;
      x.fillStyle=v.color;x.fillRect(bx,by,bw,bh);
      x.fillStyle="#e7eef6";x.font="600 13px ui-monospace,Consolas,monospace";x.textAlign="center";
      x.fillText(fmt(v.val),bx+bw/2,by-7);
      x.fillStyle="#9fb4c6";x.font="12px 'Segoe UI',system-ui,Arial,sans-serif";
      x.fillText(v.label,bx+bw/2,h-14);
      bx+=bw+gap;
    });
  }
  function lines(cv,t,series){ // series:[{data,color}]
    var s=setup(cv),x=s.x,w=s.w,h=s.h,padL=44,padB=28,padT=14,padR=12;
    clearC(x,w,h);
    var max=0;series.forEach(function(se){se.data.forEach(function(v){if(v>max)max=v;});});max=Math.max(max,1)*1.1;
    var tmax=t[t.length-1]||1;
    x.strokeStyle="#243140";x.lineWidth=1;
    for(var g=0;g<=4;g++){var yy=padT+(h-padT-padB)*g/4;x.beginPath();x.moveTo(padL,yy);x.lineTo(w-padR,yy);x.stroke();
      x.fillStyle="#6b7d8c";x.font="10px ui-monospace,Consolas,monospace";x.textAlign="right";
      x.fillText(fmt(max*(1-g/4)),padL-6,yy+3);}
    x.fillStyle="#6b7d8c";x.textAlign="center";
    x.fillText("0 h",padL,h-8);x.fillText(fmt(tmax)+" h",w-padR-10,h-8);
    series.forEach(function(se){
      x.strokeStyle=se.color;x.lineWidth=2;x.beginPath();
      se.data.forEach(function(v,i){
        var xx=padL+(w-padL-padR)*(t[i]/tmax), yy=padT+(h-padT-padB)*(1-v/max);
        if(i===0)x.moveTo(xx,yy);else x.lineTo(xx,yy);});
      x.stroke();
    });
  }

  function render(){
    if(!R)return;
    var ne=R.chips.NE555,k=R.chips.K561TL1;
    document.getElementById("k-mtbf-ne").textContent=fmt(ne.mtbf)+" h";
    document.getElementById("k-mtbf-k").textContent=fmt(k.mtbf)+" h";
    document.getElementById("k-pow-ne").textContent=fmt(ne.energyWh)+" Wh";
    document.getElementById("k-pow-k").textContent=(k.energyWh<1?(k.energyWh*1000).toFixed(2)+" mWh":fmt(k.energyWh)+" Wh");
    barLog(document.getElementById("c-cur"),[{label:"NE555",val:ne.cur,color:CHIP.NE555.color},{label:"К561ТЛ1",val:k.cur,color:CHIP.K561TL1.color}]);
    barLin(document.getElementById("c-acc"),[{label:"NE555",val:ne.acc,color:CHIP.NE555.color},{label:"К561ТЛ1",val:k.acc,color:CHIP.K561TL1.color}]);
    lines(document.getElementById("c-ft"),R.t,[{data:R.ft.NE555,color:CHIP.NE555.color},{data:R.ft.K561TL1,color:CHIP.K561TL1.color}]);
    barLin(document.getElementById("c-fail"),[
      {label:"NE555",val:ne.failovers,color:CHIP.NE555.color},
      {label:"К561ТЛ1",val:k.failovers,color:CHIP.K561TL1.color}]);
    // summary table
    var rows=[
      [tr("Ток потребления","Supply current"),fmt(ne.cur)+" µA",fmt(k.cur)+" µA","K561TL1"],
      [tr("Точность переключ.","Switching accuracy"),ne.acc+" µs",k.acc+" µs","K561TL1"],
      [tr("Ложные срабат.","False triggers"),ne.ft,k.ft,"K561TL1"],
      [tr("Ложные тревоги WDT","WDT false positives"),ne.falsePos,k.falsePos,"K561TL1"],
      [tr("Переключений на резерв","Failovers"),ne.failovers,k.failovers, ne.failovers<=k.failovers?"NE555":"K561TL1"],
      [tr("MTBF","MTBF"),fmt(ne.mtbf)+" h",fmt(k.mtbf)+" h", k.mtbf>=ne.mtbf?"K561TL1":"NE555"],
      [tr("Энергия","Energy"),fmt(ne.energyWh)+" Wh",(k.energyWh<1?(k.energyWh*1000).toFixed(2)+" mWh":fmt(k.energyWh)+" Wh"),"K561TL1"]
    ];
    var tb=document.getElementById("sumBody");tb.innerHTML="";
    rows.forEach(function(r){var tr_=document.createElement("tr");
      tr_.innerHTML="<td>"+r[0]+"</td><td class='mono'>"+r[1]+"</td><td class='mono'>"+r[2]+"</td><td class='mono win'>"+(r[3]==="K561TL1"?"К561ТЛ1":"NE555")+"</td>";
      tb.appendChild(tr_);});
    var kWins=rows.filter(function(r){return r[3]==="K561TL1";}).length;
    document.getElementById("rec").innerHTML="<b>К561ТЛ1 (CMOS)</b> "+
      tr("выигрывает по "+kWins+" из "+rows.length+" метрик — рекомендован как основное ядро. NE555 остаётся резервом (высокий выходной ток).",
         "wins "+kWins+" of "+rows.length+" metrics — recommended as the primary core. NE555 remains the backup (high output drive).");
    var d=document.getElementById("dur"), c=document.getElementById("cond");
    document.getElementById("runInfo").textContent=tr("период ","period ")+R.hours+" h · "+R.steps+tr(" точек"," points");
  }

  function run(){var hours=+document.getElementById("dur").value, cond=document.getElementById("cond").value;
    R=simulate(hours,cond);render();}

  document.getElementById("btnRun").onclick=run;
  document.getElementById("btnLang").onclick=function(){lang=lang==="ru"?"en":"ru";
    try{localStorage.setItem("stationLang",lang);}catch(e){}applyLang();if(R)render();};
  window.addEventListener("resize",function(){if(R)render();});
  applyLang();run();
})();
</script>
</body>
</html>
