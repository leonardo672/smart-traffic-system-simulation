<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аналитика надёжности — Reliability Analytics</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/analytics.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="lg" href="index.html">⬢ Smart Traffic System</a>
    <a class="lnk" href="index.html" data-ru="Главная" data-en="Home"></a>
    <a class="lnk" href="traffic_control_station.html" data-ru="Станция" data-en="Station"></a>
    <a class="lnk active" href="analytics.html" data-ru="Аналитика" data-en="Analytics"></a>
    <a class="lnk" href="oscilloscope.html" data-ru="Осциллограф" data-en="Oscilloscope"></a>
    <span class="sp"></span>
    <button id="btnLang">EN</button>
  </nav>

  <section class="card">
    <h3 data-ru="Симуляция стресс-теста надёжности" data-en="Reliability stress-test simulation"></h3>
    <div class="row">
      <label class="fld"><span data-ru="Длительность" data-en="Duration"></span>
        <select id="dur">
          <option value="24">24 h</option>
          <option value="168" selected>168 h (1 нед / 1 wk)</option>
          <option value="720">720 h (1 мес / 1 mo)</option>
          <option value="8760">8760 h (1 год / 1 yr)</option>
        </select>
      </label>
      <label class="fld"><span data-ru="Среда" data-en="Environment"></span>
        <select id="cond">
          <option value="mild" data-ru="спокойная" data-en="mild"></option>
          <option value="harsh" selected data-ru="агрессивная (ветер/осадки)" data-en="harsh (wind/precip)"></option>
          <option value="extreme" data-ru="экстремальная" data-en="extreme"></option>
        </select>
      </label>
      <button id="btnRun" class="primary" data-ru="▶ Запустить тест" data-en="▶ Run test"></button>
      <span class="hint" id="runInfo"></span>
    </div>
  </section>

  <div class="cards">
    <div class="kpi"><div class="k" data-ru="MTBF · NE555" data-en="MTBF · NE555"></div><div class="v ne" id="k-mtbf-ne">—</div><div class="s" data-ru="наработка на отказ" data-en="mean time between failures"></div></div>
    <div class="kpi"><div class="k" data-ru="MTBF · К561ТЛ1" data-en="MTBF · К561ТЛ1"></div><div class="v k5" id="k-mtbf-k">—</div><div class="s" data-ru="наработка на отказ" data-en="mean time between failures"></div></div>
    <div class="kpi"><div class="k" data-ru="Энергия · NE555" data-en="Energy · NE555"></div><div class="v ne" id="k-pow-ne">—</div><div class="s" data-ru="за период теста" data-en="over test period"></div></div>
    <div class="kpi"><div class="k" data-ru="Энергия · К561ТЛ1" data-en="Energy · К561ТЛ1"></div><div class="v k5" id="k-pow-k">—</div><div class="s" data-ru="за период теста" data-en="over test period"></div></div>
  </div>

  <div class="charts">
    <div class="chart">
      <h4 data-ru="Ток потребления (лог. шкала)" data-en="Supply current (log scale)"></h4>
      <p class="cap" data-ru="мкА · ниже — лучше" data-en="µA · lower is better"></p>
      <canvas id="c-cur" width="520" height="220"></canvas>
    </div>
    <div class="chart">
      <h4 data-ru="Точность переключения" data-en="Switching accuracy"></h4>
      <p class="cap" data-ru="мкс · ниже — лучше" data-en="µs · lower is better"></p>
      <canvas id="c-acc" width="520" height="220"></canvas>
    </div>
    <div class="chart">
      <h4 data-ru="Накопленные ложные срабатывания" data-en="Cumulative false triggers"></h4>
      <p class="cap" data-ru="по времени теста" data-en="over test time"></p>
      <canvas id="c-ft" width="520" height="220"></canvas>
      <div class="legend">
        <span><i style="background:var(--ne)"></i>NE555</span>
        <span><i style="background:var(--k5)"></i>К561ТЛ1</span>
      </div>
    </div>
    <div class="chart">
      <h4 data-ru="Отказы и переключения на резерв" data-en="Failures &amp; failovers"></h4>
      <p class="cap" data-ru="событий за период" data-en="events over period"></p>
      <canvas id="c-fail" width="520" height="220"></canvas>
      <div class="legend">
        <span><i style="background:var(--ne)"></i>NE555</span>
        <span><i style="background:var(--k5)"></i>К561ТЛ1</span>
      </div>
    </div>
  </div>

  <section class="card">
    <h3 data-ru="Итоговая таблица" data-en="Summary table"></h3>
    <table>
      <thead><tr><th data-ru="Метрика" data-en="Metric"></th><th>NE555</th><th>К561ТЛ1</th><th data-ru="Лучше" data-en="Winner"></th></tr></thead>
      <tbody id="sumBody"></tbody>
    </table>
    <div class="rec" id="rec" style="margin-top:12px"></div>
    <p class="hint" data-ru="Данные сгенерированы моделью на основе параметров чипов из config.yaml (помехозащищённость, ток, точность). Это симуляция, не измерения на реальном железе." data-en="Data is generated by a model from the chip parameters in config.yaml (noise immunity, current, accuracy). This is a simulation, not real-hardware measurements."></p>
  </section>
</div>

<script src="js/i18n.js"></script>
<script src="js/analytics.js"></script>
</body>
</html>
